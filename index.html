<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>iOS Interview Prep</title>
<meta name="description" content="Spaced-repetition study tool for senior iOS engineering interviews.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128241;</text></svg>">
</head>
<body>

<canvas id="confetti"></canvas>

<div id="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">iOS</div>
      <div class="brand-text">
        <strong>Interview Prep</strong>
        <span>38 topics, 5 modes</span>
      </div>
    </div>

    <nav class="nav">
      <a href="#/dashboard" data-nav="dashboard"><span class="ico"></span> Overview</a>
      <a href="#/flashcards" data-nav="flashcards"><span class="ico"></span> Flashcards <em id="nav-due"></em></a>
      <a href="#/quiz" data-nav="quiz"><span class="ico"></span> Quiz</a>
      <a href="#/code" data-nav="code"><span class="ico"></span> Code</a>
      <a href="#/mock" data-nav="mock"><span class="ico"></span> Mock interview</a>
      <a href="#/gauntlet" data-nav="gauntlet"><span class="ico"></span> The Gauntlet</a>
      <a href="#/topics" data-nav="topics"><span class="ico"></span> Topics</a>
      <a href="#/badges" data-nav="badges"><span class="ico"></span> Badges</a>
    </nav>

    <div class="sidebar-foot">
      <div id="level-box"></div>
      <div id="streak-box"></div>
      <button class="btn ghost tiny" id="btn-settings" style="justify-content:center">Settings</button>
    </div>
  </aside>

  <main class="main">
    <div id="view"></div>
  </main>

</div>

<div id="toasts"></div>

<div id="modal" class="modal-backdrop" style="display:none">
  <div class="modal" id="modal-body"></div>
</div>

<script src="js/core.js?v=3"></script>
<script src="js/store.js?v=3"></script>

<script src="data/challenges.js?v=3"></script>
<script src="data/mock.js?v=3"></script>

<script src="js/dashboard.js?v=3"></script>
